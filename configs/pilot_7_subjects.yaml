# Configuration for Phase C: Pilot Evaluation on Next 7 Subjects
experiment_name: pilot_7_subjects
description: >
  Pilot run on the next 7 subjects in sequential numerical ID order.
  Settings frozen from Phase A (GT-timestamp timing baseline) and Phase B (padding rule).
  Gate check:
    1) Median video-level error <= 2.0 BPM
    2) At least 70% of subjects with waveform r >= 0.7
  No cherry-picking, no parameter tuning per subject, all subjects reported including failures.

dataset:
  root_dir: "data/ubfc/Data Set 2"
  fallback_dir: "/content/drive/MyDrive/DATASET_2"
  exclude_exploration_subjects:
    - subject1
    - subject3
    - subject4
  pilot_subject_count: 7

preprocessing:
  target_fs: 30.0
  bandpass:
    lowcut: 0.7
    highcut: 3.0
    order: 3
  windowing:
    window_sec: 30.0
    stride_sec: 1.0

padding_rule:
  fixed_border_px: 60
  border_mode: "reflect"

gate:
  max_median_video_error_bpm: 2.0
  min_pct_waveform_r_above_07: 70.0

outputs:
  results_csv: "results/pilot_7_subjects.csv"
  plot_dir: "results/plots/pilot_7_subjects"

